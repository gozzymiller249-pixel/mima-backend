<!DOCTYPE html>
<html>
<head>
    <title>Login - StockWise SSA</title>
    <style>
        body { font-family: Arial; margin: 50px; background: #f3f4f6; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
        h2 { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login - StockWise SSA</h2>
        <form id="loginForm">
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = 'Logging in...';
            
            const response = await fetch('http://localhost/mima/api/test_login.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, password })
            });
            const result = await response.json();
            
            console.log('Login result:', result);
            
            if (result.success) {
                // Save user data to localStorage
                const userString = JSON.stringify(result.user);
                localStorage.setItem('user', userString);
                localStorage.setItem('auth_token', 'logged_in');
                
                console.log('Saved to localStorage. user =', localStorage.getItem('user'));
                
                messageDiv.innerHTML = '<p class="success">Login successful! Redirecting...</p>';
                
                // Redirect to React app
                window.location.href = 'http://localhost:5173';
            } else {
                messageDiv.innerHTML = '<p class="error">' + result.message + '</p>';
            }
        };
    </script>
</body>
</html>
