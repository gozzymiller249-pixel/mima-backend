<!DOCTYPE html>
<html>
<head>
    <title>Simple Login</title>
</head>
<body>
    <h2>Simple Login Test</h2>
    <button id="loginBtn">Click to Login Test User</button>
    <div id="result"></div>

    <script>
        document.getElementById('loginBtn').onclick = async () => {
            const data = {
                phone: '08077777777',     // ← YOUR PHONE NUMBER
                password: 'password123'   // ← YOUR PASSWORD
            };
            
            document.getElementById('result').innerHTML = 'Sending request...';
            
            try {
                const response = await fetch('/mima/api/test_login.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        };
    </script>
</body>
</html>
