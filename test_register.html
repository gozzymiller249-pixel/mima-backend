<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
</head>
<body>
    <h2>Register User</h2>
    <form id="registerForm">
        Phone: <input type="text" name="phone" value="08012345678"><br><br>
        Business Name: <input type="text" name="business_name" value="My Business"><br><br>
        Password: <input type="password" name="password" value="password123"><br><br>
        <button type="submit">Register</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                phone: formData.get('phone'),
                business_name: formData.get('business_name'),
                password: formData.get('password')
            };
            
            const response = await fetch('/mima/api/index.php?route=register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await response.json();
            document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
        };
    </script>
</body>
</html>
